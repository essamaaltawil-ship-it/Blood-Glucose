$('auth-form').onsubmit=async e=>{e.preventDefault();if(!auth||$('login-btn').disabled)return;let u=$('user').value.trim(),p=$('pass').value;$('login-btn').disabled=true;try{await sdk.signInWithEmailAndPassword(auth,u.includes('@')?u:u+'@sukkar.app',p);$('pass').value='';$('pass').type='password';$('show-pass').textContent='إظهار';$('show-pass').setAttribute('aria-pressed','false');$('show-pass').setAttribute('aria-label','إظهار كلمة المرور')}catch{$('auth-status').textContent='تعذر الدخول؛ تحقق من الحساب وكلمة المرور والاتصال.'}finally{$('login-btn').disabled=false}};$('show-pass').onclick=()=>{let show=$('pass').type==='password';$('pass').type=show?'text':'password';$('show-pass').textContent=show?'إخفاء':'إظهار';$('show-pass').setAttribute('aria-pressed',String(show));$('show-pass').setAttribute('aria-label',show?'إخفاء كلمة المرور':'إظهار كلمة المرور')};$('fold').onclick=()=>{let folded=document.documentElement.classList.toggle('side-folded');$('fold').setAttribute('aria-expanded',String(!folded));$('fold').setAttribute('aria-label',folded?'توسيع القائمة':'طي القائمة')};document.addEventListener('visibilitychange',()=>document.documentElement.dataset.background=String(document.hidden));$('retry').onclick=init;$('logout').onclick=async()=>{try{await sdk.signOut(auth)}catch{notify('تعذر تسجيل الخروج')}};let printViews=[];window.addEventListener('beforeprint',()=>{printViews=[...document.querySelectorAll('.chart-frame svg.chart')].map(svg=>[svg,svg.getAttribute('viewBox')]);printViews.forEach(([svg])=>svg.setAttribute('viewBox','0 0 700 220'))});window.addEventListener('afterprint',()=>{printViews.forEach(([svg,v])=>svg.setAttribute('viewBox',v));printViews=[]});window.addEventListener('offline',()=>{$('sync').textContent='الجهاز غير متصل؛ البيانات قد تكون قديمة'});window.addEventListener('online',()=>{$('sync').textContent='عاد اتصال الجهاز؛ بانتظار تأكيد الخادم'});init();
</script></body></html>
